<template>

    
    <lightning-input-rich-text
        class="customRichText"
        disabled={disabled}
        label={label}
        label-visible={labelVisible}
        placeholder={placeholder}
        required={required}
        formats={customFormats}
        field-level-help={fieldLevelHelp}
        message-when-bad-input={errorMessage}
        value={value}
        valid={valid}
        onfocus={handleChangeValidation}
        onblur={handleChangeValidation}
        oninput={handleChangeValidation}
        onkeyup={handleChangeValidation}
        onchange={handleChangeValidation}>
    </lightning-input-rich-text>

    <template if:true={displayCharacterCount}>
        <div class="slds-grid">
            <div class="slds-col slds-size_1-of-1">
                <span class="slds-float_left">
                    <lightning-formatted-text value={labels.characterLabelText}></lightning-formatted-text>
                    {currentCharacterCount}
                    <template if:true={maxCharacterCount}> / {maxCharacterCount}</template>
                    <template if:true={minCharacterCount}>
                        ({labels.minWordCharacterCountText} {minCharacterCount})
                    </template>
                </span>
            </div>
        </div>
    </template>

    <template if:true={displayWordCount}>
        <div class="slds-grid">
            <div class="slds-col slds-size_1-of-1">
                <span class="slds-float_left">
                    <lightning-formatted-text value={labels.wordCountLabelText}></lightning-formatted-text>
                    {currentWordCount}
                    <template if:true={maxWordCount}> / {maxWordCount}</template>
                    <template if:true={minWordCount}>
                        ({labels.minWordCharacterCountText} {minWordCount})
                    </template>
                </span>
            </div>
        </div>
    </template> 
    
</template>
