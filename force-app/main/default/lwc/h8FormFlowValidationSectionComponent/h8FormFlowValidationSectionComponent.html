<!--
  @description       : html to output an entire sections validation errors
  @author            : daniel@hyphen8.com
  @last modified on  : 12-08-2026
  @last modified by  : daniel@hyphen8.com
-->
<template>
    <template if:false={isLoading}>
        <template if:false={success}>
            <div class="slds-box validation-box">
                <div class="slds-var-m-around_medium">
                    <div class="slds-text-heading_medium slds-var-m-bottom_medium">
                        {message}
                    </div>
                </div>
            </div>
        </template>

        <template if:true={success}>
            <template if:true={hasValidationErrors}>
                <c-h8-section-validation-panel
                    section-label={resolvedSectionLabel}
                    affect-text-label={affectTextLabel}
                    help-text={helpText}
                    default-open="true"
                    live-has-errors={liveHasErrors}
                    live-pages={livePages}
                    master-has-errors={masterHasErrors}
                    master-pages={masterPages}>
                </c-h8-section-validation-panel>
            </template>
        </template>
    </template>
</template>
