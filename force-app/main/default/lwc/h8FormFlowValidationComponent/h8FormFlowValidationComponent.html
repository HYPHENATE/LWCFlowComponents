<!--
  @description       : html for core validation component for validation and entire form
  @author            : daniel@hyphen8.com
  @last modified on  : 12-08-2026
  @last modified by  : daniel@hyphen8.com
-->
<template>
    
    <template if:true={isLoading}>
        <div class="slds-align_absolute-center slds-is-relative spinner-container">
            <lightning-spinner
                alternative-text={label.loadingAltText} variant="brand">
            </lightning-spinner>
        </div>
    </template>
    
    <template if:false={isLoading}>

        <template if:false={success}>

            <div class="slds-box validation-box">
                <div class="slds-var-m-around_medium">
                    <div class="slds-text-heading_medium slds-var-m-bottom_medium">
                        {message}
                    </div>
                  </div>
            </div>

        </template>

        <template if:true={success}>

            <template if:true={hasErrors}>
                <h3 class="summary-heading slds-var-m-bottom_x-small" data-id="summaryHeading" tabindex="-1">
                    {cardTitle}
                </h3>
                <div class="slds-var-m-bottom_medium">
                    <lightning-formatted-rich-text value={invalidCardDescription}></lightning-formatted-rich-text>
                </div>
                <div class="slds-box validation-box">
                    <div class="slds-var-m-around_medium">
                        <div class="slds-var-m-bottom_medium">
                            <lightning-formatted-rich-text value={completeFieldsText}></lightning-formatted-rich-text>
                        </div>

                        <ul class="section-summary-list">
                            <template for:each={sections} for:item="section">
                                <li key={section.sectionName} class="slds-var-m-bottom_small">
                                    <h3 class="section-summary-heading slds-var-m-bottom_x-small">
                                        {section.displayLabel}
                                    </h3>
                                    <template for:each={section.pages} for:item="page">
                                        <c-h8-form-flow-validation-page-item-component key={page.pageName} page={page} affect-text-label={affectTextLabel}></c-h8-form-flow-validation-page-item-component>
                                    </template>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </template>
            
            <template if:true={isValid}>
                <h3 class="summary-heading slds-var-m-bottom_x-small">
                    {cardTitle}
                </h3>
                <div class="slds-var-m-bottom_medium">
                    <lightning-formatted-rich-text value={validCardDescription}></lightning-formatted-rich-text>
                </div>
                <div slot="footer">
                    <div class="slds-clearfix">
                        <div class="slds-float_right">
                            <lightning-button label={nextButtonLabel} variant="brand" onclick={handleNext}></lightning-button>
                        </div>
                    </div>
                </div>
            </template>
        </template>
    </template>
</template>
