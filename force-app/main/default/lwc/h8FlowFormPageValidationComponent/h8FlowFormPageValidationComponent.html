  @author            : daniel@hyphen8.com
  @last modified on  : 10-09-2025
  @last modified by  : daniel@hyphen8.com
-->
<template>

  <template if:false={isLoading}>
    <template if:false={success}>
      <div class="slds-box validation-box">
        <div class="slds-var-m-around_medium">
          <div class="slds-text-heading_medium slds-var-m-bottom_medium">
            {message}
          </div>
        </div>
      </div>
    </template>

    <template if:true={success}>
      <template if:true={hasValidationErrors}>
        <div class={panelClass}>
          <div class="slds-var-m-around_medium">
            <p class="page-validation-help slds-var-m-bottom_medium">{helpText}</p>
            <ul class="page-validation-list">
              <template for:each={validationErrors} for:item="error">
                <li class={itemClass} key={error.questionName}>
                  <lightning-icon class="slds-var-m-right_small" icon-name={iconName} variant={iconVariant} size="x-small" alternative-text="" title=""></lightning-icon>
                  <span>{error.questionName}</span>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </template>
    </template>
  </template>
</template>
