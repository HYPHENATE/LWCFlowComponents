<!--
  @description       : html for outputting page errors
  @author            : daniel@hyphen8.com
  @last modified on  : 12-08-2026
  @last modified by  : daniel@hyphen8.com
-->
<template>
    
    <template if:true={displayPage}>
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_12-of-12">
                <ul class="page-summary-list">
                    <li>
                        <template if:true={showPageName}>
                            <h4 class="page-summary-heading slds-var-m-bottom_x-small">
                                {page.pageName}
                            </h4>
                        </template>
                        <ul class="page-error-list">
                            <template for:each={page.errors} for:item="error">
                                <li key={error.questionName}>
                                    <div class={errorRowClass}>
                                        <lightning-icon class="slds-var-m-right_small" icon-name={iconName} variant={iconVariant} size="x-small" alternative-text="" title=""></lightning-icon>
                                        <span>{error.questionName}</span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </template>
    <template if:false={displayPage}>
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_12-of-12">
                <ul class="page-error-list">
                  <template for:each={page.errors} for:item="error">
                    <li key={error.questionName}>
                      <div class={errorRowClass}>
                          <lightning-icon class="slds-var-m-right_small" icon-name={iconName} variant={iconVariant} size="x-small" alternative-text="" title=""></lightning-icon>
                          <span>{error.questionName}</span>
                      </div>
                    </li>
                  </template>
                </ul>
            </div>
        </div>
    </template>
</template>
